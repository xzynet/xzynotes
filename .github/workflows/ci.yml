name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm compile

      - name: Unit tests (coverage gate ≥ 80% on core/)
        run: pnpm test:coverage

      - name: Build (Chrome MV3)
        run: pnpm build

      - name: Build (Firefox MV3)
        run: pnpm build:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: kedaibiao-chrome-mv3
          path: .output/chrome-mv3

      - uses: actions/upload-artifact@v4
        with:
          name: kedaibiao-firefox-mv3
          path: .output/firefox-mv3

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Chrome MV3)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e
